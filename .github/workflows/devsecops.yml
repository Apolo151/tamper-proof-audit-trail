# Shift-left DevSecOps pipeline. Stages run in strict order (via `needs:`) so a
# failure in a cheap early gate (secrets, SAST) stops the run before any build.
#
# Hardening note: third-party actions are pinned to release tags here for
# readability. For production, pin every `uses:` to a full commit SHA and let
# .github/dependabot.yml raise update PRs (`pinact` can do the initial rewrite).
name: devsecops

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for the whole workflow. Individual jobs widen this only when
# they must (e.g. uploading SARIF needs security-events: write).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  IMAGE: auditd

jobs:
  # 1. Secret scanning - runs first and cheapest. A leaked credential should
  #    stop the pipeline before anything is built or published.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. SAST - static analysis of the Go source.
  sast:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
      - name: gosec
        uses: securego/gosec@master
        with:
          args: -severity medium -confidence medium ./...

  # 3. Unit tests with the race detector + coverage.
  test:
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  # 4. SCA / dependency scanning. govulncheck is Go-call-graph aware (only fails
  #    on CVEs the code actually reaches, stdlib included); trivy fs is the
  #    broader manifest + secret sweep. Together they are the "dependency
  #    scanning" layer.
  sca:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}
          repo-checkout: false
      - name: trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          exit-code: "1"
          severity: CRITICAL,HIGH

  # 5. IaC scanning - Terraform + Kubernetes manifests + Dockerfile.
  iac:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: checkov (terraform)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          config_file: terraform/.checkov.yaml
          soft_fail: false
      - name: checkov (kubernetes)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: deploy/k8s/
          framework: kubernetes
          soft_fail: false
      - name: hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  # 6. Build the image and scan it for CVEs, then publish an SBOM. Runs only
  #    after every source-level gate has passed.
  image:
    needs: [sca, iac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -t "$IMAGE:${{ github.sha }}" .
      - name: trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          ignore-unfixed: true
          exit-code: "1"
          severity: CRITICAL,HIGH
      - name: generate SBOM (syft / SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
