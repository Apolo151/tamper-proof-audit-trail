# Shift-left DevSecOps pipeline. Stages run in strict order (via `needs:`) so a
# failure in a cheap early gate (secrets, SAST) stops the run before any build.
#
# Supply chain: every third-party action is pinned to a full commit SHA (the
# trailing comment is the release it came from; Dependabot keeps both current).
# A tag or branch ref is mutable - whoever controls it controls code that runs
# here with this workflow's token.
#
# On main only, the scanned image is pushed to GHCR, signed keyless with cosign
# (GitHub OIDC -> Fulcio cert, logged in Rekor), and given SBOM + SLSA build
# provenance attestations. A separate read-only job then verifies all of it
# against this workflow's exact identity and fails the run if anything is off.
name: devsecops

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for the whole workflow. Individual jobs widen this only when
# they must (publish needs to push, mint an OIDC token, and write attestations).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # explicit shell => bash -eo pipefail

env:
  GO_VERSION: "1.26"
  HELM_VERSION: v4.3.1 # ct 3.15 lint + install verified against Helm 4 on kind
  IMAGE: auditd
  CHART_DIR: deploy/helm/auditd
  # promtool + prometheus come from the official release tarball, verified
  # against this pinned checksum (from the release's sha256sums.txt) first.
  PROMETHEUS_VERSION: "3.15.1"
  PROMETHEUS_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84

jobs:
  # 1. Secret scanning - runs first and cheapest. A leaked credential should
  #    stop the pipeline before anything is built or published.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so gitleaks can scan every commit
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. SAST - static analysis of the Go source.
  sast:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: latest
          install-go: false
      - name: gosec
        uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # v2.30.0
        with:
          args: -severity medium -confidence medium ./...

  # 3. Unit tests with the race detector + coverage.
  test:
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  # 4. SCA / dependency scanning. govulncheck is Go-call-graph aware (only fails
  #    on CVEs the code actually reaches, stdlib included); trivy fs is the
  #    broader manifest + secret sweep. Together they are the "dependency
  #    scanning" layer.
  sca:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ env.GO_VERSION }}
          repo-checkout: false
      - name: trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          exit-code: "1"
          severity: CRITICAL,HIGH

  # 5. IaC scanning - Terraform + Dockerfile. (Kubernetes manifests are
  #    rendered from the Helm chart and scanned in the `helm` job.)
  iac:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: checkov (terraform)
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          directory: terraform/
          framework: terraform
          config_file: terraform/.checkov.yaml
          soft_fail: false
      - name: hadolint (Dockerfile)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  # 5b. Helm chart: lint it, scan the manifests it actually renders, then
  #     install it for real on kind inside a PSS-restricted namespace. `ct
  #     install` also runs `helm test`, so the test pod must pass admission too.
  helm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # ct diffs against main to find changed charts
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint
        run: |
          helm lint --strict "$CHART_DIR"
          helm lint --strict "$CHART_DIR" -f "$CHART_DIR/ci/kind-values.yaml"
      - name: render chart
        run: helm template auditd "$CHART_DIR" --namespace audit > rendered-chart.yaml
      - name: checkov (rendered chart)
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          file: rendered-chart.yaml
          framework: kubernetes
          soft_fail: false
      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      # Lints changed charts and fails if a changed chart did not bump its
      # version (published versions are immutable).
      - name: ct lint
        run: ct lint --config ct.yaml
      - name: build image for the kind smoke test
        run: docker build -t auditd:local .
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: chart-testing
      - name: load image + create the restricted namespace
        run: |
          kind load docker-image auditd:local --name chart-testing
          kubectl apply -f deploy/namespace.yaml
      - name: ct install (helm install + helm test)
        run: ct install --config ct.yaml --all

  # 5c. Observability: the alert rules are code, so they get unit tests.
  #     promtool checks rule syntax, runs every alert scenario (fires / must
  #     not fire), lints the real /metrics output of the binary, and the
  #     tamper demo proves an on-disk edit flips auditd_chain_intact to 0;
  #     finally a real Prometheus evaluates the rules and must fire
  #     AuditdChainTampered end to end.
  observability:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: install promtool + prometheus (checksum-verified)
        run: |
          tarball="prometheus-$PROMETHEUS_VERSION.linux-amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/prometheus/prometheus/releases/download/v$PROMETHEUS_VERSION/$tarball"
          echo "$PROMETHEUS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" --strip-components=1 \
            "prometheus-$PROMETHEUS_VERSION.linux-amd64/promtool" \
            "prometheus-$PROMETHEUS_VERSION.linux-amd64/prometheus"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: promtool check rules
        run: make check-rules
      - name: promtool test rules
        run: make test-rules
      - name: promtool check metrics (real /metrics output)
        run: make check-metrics
      - name: tamper -> metric demo
        run: make tamper-alert-demo
      - name: tamper -> real Prometheus alert fires
        run: make prometheus-alert-demo

  # 6. Build the image and scan it for CVEs, then publish an SBOM. Runs only
  #    after every source-level gate has passed. On main, the exact image that
  #    was scanned is handed to `publish` as a tarball - it is never rebuilt.
  image:
    needs: [sca, iac]
    runs-on: ubuntu-latest
    outputs:
      image-id: ${{ steps.build.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Plain single-manifest image on the default builder. BuildKit's own
      # (unsigned) provenance/SBOM attestations are disabled: the signed ones
      # are attached in `publish`. With the runner's containerd image store,
      # leaving them on wraps the image in an OCI index carrying an
      # unknown/unknown attestation manifest, which GHCR rejected on push
      # ("denied") after accepting every layer.
      - name: build image
        id: build
        run: |
          docker build --provenance=false --sbom=false -t "$IMAGE:$GITHUB_SHA" .
          echo "image-id=$(docker inspect --format '{{.Id}}' "$IMAGE:$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      # Runs on PRs too, so a regression is caught before it reaches publish.
      # The tarball's own index.json always lists the saved images; it must
      # reference exactly one image manifest (OCI or Docker v2), not a nested
      # index that could carry attestation manifests.
      - name: assert plain single-manifest image
        run: |
          docker save "$IMAGE:$GITHUB_SHA" -o image-check.tar
          tar -xf image-check.tar index.json
          jq -e '(.manifests | length) == 1
                 and (.manifests[0].mediaType | IN(
                       "application/vnd.oci.image.manifest.v1+json",
                       "application/vnd.docker.distribution.manifest.v2+json"))' index.json \
            || { echo "::error::image is not a single plain manifest:"; jq . index.json; exit 1; }
          rm -f image-check.tar index.json
      - name: trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          ignore-unfixed: true
          exit-code: "1"
          severity: CRITICAL,HIGH
      - name: generate SBOM (syft / SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
      - name: export scanned image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save "$IMAGE:$GITHUB_SHA" -o auditd-image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: auditd-image
          path: auditd-image.tar
          retention-days: 1

  # 7. Publish: push to GHCR, sign keyless, attach SBOM + SLSA provenance,
  #    then package the Helm chart pinned to that digest, push it as an OCI
  #    artifact and sign it too. main only - PRs (especially from forks) never
  #    get write tokens or an OIDC identity that could sign. This is the only
  #    job with write scopes.
  publish:
    needs: [image, helm, observability]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # push the image + signature/attestation artifacts to GHCR
      id-token: write     # mint the GitHub OIDC token cosign exchanges for a Fulcio cert
      attestations: write # store the provenance attestation in GitHub's attestation API
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      chart-ref: ${{ steps.chart.outputs.ref }}
      chart-digest: ${{ steps.chart.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: auditd-image
      - name: load scanned image
        env:
          SCANNED_ID: ${{ needs.image.outputs.image-id }}
        run: |
          docker load -i auditd-image.tar
          # The artifact store is a trust boundary between jobs: refuse to
          # publish anything other than the exact image `image` scanned.
          loaded=$(docker inspect --format '{{.Id}}' "$IMAGE:$GITHUB_SHA")
          if [[ "$loaded" != "$SCANNED_ID" ]]; then
            echo "::error::loaded image $loaded != scanned image $SCANNED_ID"
            exit 1
          fi
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push to GHCR
        id: push
        run: |
          # OCI repository names must be lowercase; the owner is "Apolo151".
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE"
          for tag in "sha-${GITHUB_SHA::7}" main; do
            docker tag "$IMAGE:$GITHUB_SHA" "$repo:$tag"
            docker push "$repo:$tag"
          done
          # Ask the registry what it actually holds rather than parsing push output.
          digest=$(docker buildx imagetools inspect "$repo:sha-${GITHUB_SHA::7}" --format '{{.Manifest.Digest}}')
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not determine pushed digest"
            exit 1
          fi
          echo "image=$repo" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed $repo@$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Always sign / attest the digest, never a tag: tags are mutable pointers.
      - name: cosign sign (keyless)
        env:
          REF: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: generate SBOM of the pushed digest
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: cosign attest SBOM
        env:
          REF: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
      # actions/attest: with no predicate it generates SLSA build provenance;
      # with sbom-path it attests the SBOM. (attest-build-provenance and
      # attest-sbom are deprecated wrappers around it.)
      - name: SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records are only supported for organization-owned repos.
          create-storage-record: false
      - name: SBOM attestation (GitHub attestation store)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      # A chart version is released once and never overwritten. The published
      # chart defaults to the image digest pushed and signed above, so
      # `helm install oci://...` runs exactly that image - no tag involved.
      - name: package + push Helm chart (OCI)
        id: chart
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          oci="oci://ghcr.io/$owner/charts"
          version=$(helm show chart "$CHART_DIR" | awk '$1 == "version:" {print $2}')
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if helm show chart "$oci/auditd" --version "$version" > /dev/null 2>&1; then
            echo "chart auditd $version already published (immutable) - bump Chart.yaml version to release a new one" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sed -i -E "s|^  digest: \"\"|  digest: \"$IMAGE_DIGEST\"|" "$CHART_DIR/values.yaml"
          grep -q "^  digest: \"$IMAGE_DIGEST\"" "$CHART_DIR/values.yaml"
          helm lint --strict "$CHART_DIR"
          helm package "$CHART_DIR" --app-version "sha-${GITHUB_SHA::7}" --destination dist
          helm push "dist/auditd-$version.tgz" "$oci" 2>&1 | tee helm-push.log
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' helm-push.log | head -1)
          if [[ -z "$digest" ]]; then
            echo "::error::could not determine pushed chart digest"
            exit 1
          fi
          echo "ref=ghcr.io/$owner/charts/auditd" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed chart $oci/auditd:$version ($digest), image pinned to $IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: cosign sign Helm chart
        if: steps.chart.outputs.digest != ''
        env:
          REF: ${{ steps.chart.outputs.ref }}@${{ steps.chart.outputs.digest }}
        run: cosign sign --yes "$REF"

  # 8. Verify gate: read-only, and trusts nothing from `publish` except the
  #    digest. A signature only means something if it is checked against an
  #    expected identity - without --certificate-identity, *any* GitHub
  #    workflow's signature would pass.
  verify-signature:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read     # pull signatures/attestations while the package is private
      attestations: read # read provenance from GitHub's attestation API
    env:
      REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
      CERT_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/devsecops.yml@refs/heads/main
      CERT_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: cosign verify (signature)
        run: |
          cosign verify \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$CERT_ISSUER" \
            "$REF" > /dev/null
          echo "signature OK for $REF" >> "$GITHUB_STEP_SUMMARY"
      - name: cosign verify-attestation (SBOM)
        run: |
          cosign verify-attestation --type spdxjson \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$CERT_ISSUER" \
            "$REF" > /dev/null
          echo "SBOM attestation OK" >> "$GITHUB_STEP_SUMMARY"
      - name: gh attestation verify (SLSA provenance)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://$REF" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/devsecops.yml"
          echo "SLSA provenance OK" >> "$GITHUB_STEP_SUMMARY"
      - name: gh attestation verify (SBOM)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://$REF" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/devsecops.yml" \
            --predicate-type https://spdx.dev/Document/v2.3
          echo "SBOM attestation (GitHub store) OK" >> "$GITHUB_STEP_SUMMARY"
      - name: cosign verify (Helm chart)
        if: needs.publish.outputs.chart-digest != ''
        env:
          CHART_REF: ${{ needs.publish.outputs.chart-ref }}@${{ needs.publish.outputs.chart-digest }}
        run: |
          cosign verify \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$CERT_ISSUER" \
            "$CHART_REF" > /dev/null
          echo "chart signature OK for $CHART_REF" >> "$GITHUB_STEP_SUMMARY"
      # Negative control: prove the gate is not a no-op. Verification against
      # a foreign identity MUST fail; if it passes, identity pinning is broken.
      - name: negative test (foreign identity must be rejected)
        run: |
          if cosign verify \
              --certificate-identity "https://github.com/attacker/evil/.github/workflows/build.yml@refs/heads/main" \
              --certificate-oidc-issuer "$CERT_ISSUER" \
              "$REF" > /dev/null 2>&1; then
            echo "::error::cosign verify accepted a signature from a foreign identity"
            exit 1
          fi
          echo "foreign identity correctly rejected" >> "$GITHUB_STEP_SUMMARY"
