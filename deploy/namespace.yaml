# The namespace is cluster policy, not part of the app, so it lives outside the
# Helm chart: whoever owns the cluster decides the Pod Security level, and the
# chart must fit into it. Apply this before `helm install -n audit`.
apiVersion: v1
kind: Namespace
metadata:
  name: audit
  labels:
    app.kubernetes.io/part-of: tamper-proof-audit-trail
    # Enforce the strictest Pod Security Standard for everything in this namespace.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
