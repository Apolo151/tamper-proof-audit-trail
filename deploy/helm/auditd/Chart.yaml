apiVersion: v2
name: auditd
description: >-
  Tamper-evident, hash-chained audit-log service. Hardened for the restricted
  Pod Security Standard; the hardening is fixed in the templates, not values.
type: application
# Chart version: bump on every chart change (ct lint enforces this on PRs).
# A published version is immutable - CI never overwrites it in GHCR.
version: 0.3.0
# Overridden at publish time with the image tag (sha-<short>) the chart pins.
appVersion: "main"
kubeVersion: ">=1.25.0-0"  # Pod Security Admission is GA from 1.25
home: https://github.com/Apolo151/tamper-proof-audit-trail
sources:
  - https://github.com/Apolo151/tamper-proof-audit-trail
maintainers:
  - name: Apolo151
    url: https://github.com/Apolo151
keywords:
  - audit
  - security
  - tamper-evident
