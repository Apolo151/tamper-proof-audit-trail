{{- if .Values.networkPolicy.enabled }}
# Default deny for every pod in the namespace: nothing in, nothing out unless a
# later policy allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "auditd.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auditd.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# auditd needs: inbound HTTP on 8080 (API clients), inbound on the metrics
# port (the scraper only), and outbound DNS. Nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "auditd.fullname" . }}-allow
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auditd.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "auditd.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- with .Values.networkPolicy.ingressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    - from:
        {{- with .Values.metrics.scrapeFrom }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.metrics.port }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
