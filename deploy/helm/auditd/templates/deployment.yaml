apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auditd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auditd.labels" . | nindent 4 }}
  {{- with include "auditd.checkovSkips" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  # Single writer: the hash chain is per-pod state on an emptyDir. Two replicas
  # would fork the chain (values.schema.json pins this to 1). Production path:
  # StatefulSet + RWO PVC, or move the chain into a shared WORM datastore.
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "auditd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "auditd.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "auditd.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "auditd.podSecurityContext" . | nindent 8 }}
      containers:
        - name: auditd
          image: {{ include "auditd.image" . | quote }}
          imagePullPolicy: {{ include "auditd.pullPolicy" . }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATA_DIR
              value: /data
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          securityContext:
            {{- include "auditd.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
