{{- if .Values.metrics.prometheusRule.enabled }}
# The rule files are shipped verbatim (single source of truth, unit-tested
# with promtool in deploy/prometheus/tests/). Their {{ "{{ $value }}" }} alert
# templates are data to Prometheus, not to Helm: .Files.Get does not render them.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "auditd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auditd.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- range $file := list "files/prometheus/recording-rules.yaml" "files/prometheus/alerts.yaml" }}
    {{- $rules := $.Files.Get $file | fromYaml }}
    {{- toYaml (get $rules "groups") | nindent 4 }}
    {{- end }}
{{- end }}
