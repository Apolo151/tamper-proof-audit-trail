{{- if .Values.metrics.serviceMonitor.enabled }}
# Scrape config for prometheus-operator. The job label is pinned to "auditd"
# because the alert and recording rules in deploy/prometheus/ select on it.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "auditd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auditd.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      {{- include "auditd.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
