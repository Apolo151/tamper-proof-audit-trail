# Dedicated identity with no API access; the token is not mounted either
# (automountServiceAccountToken: false here and on the pod).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "auditd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auditd.labels" . | nindent 4 }}
automountServiceAccountToken: false
