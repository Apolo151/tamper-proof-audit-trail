apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: audit

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - networkpolicy-default-deny.yaml
  - networkpolicy-allow.yaml
  - deployment.yaml
  - service.yaml

images:
  - name: auditd
    newName: auditd
    newTag: local
    # CI overrides this with a digest:
    #   kustomize edit set image auditd=ghcr.io/apolo151/auditd@sha256:<digest>
