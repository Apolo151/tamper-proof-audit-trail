apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: audit

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - networkpolicy-default-deny.yaml
  - networkpolicy-allow.yaml
  - deployment.yaml
  - service.yaml

images:
  - name: auditd
    newName: auditd
    newTag: local
    # Local kind uses the tag above. To deploy the signed image CI publishes,
    # pin it by digest (verify it first with `make verify-image`):
    #   kustomize edit set image auditd=ghcr.io/apolo151/auditd@sha256:<digest>
