# auditd needs: inbound HTTP on 8080, and outbound DNS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auditd-allow
  namespace: audit
spec:
  podSelector:
    matchLabels:
      app: auditd
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Demo scope: allow callers from within the audit namespace. In a real
        # cluster, restrict this to the ingress-controller namespace instead.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: audit
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
